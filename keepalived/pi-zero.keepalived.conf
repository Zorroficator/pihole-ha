! keepalived — Pi Zero (VRRP BACKUP, UNICAST)
! Deploy target: /etc/keepalived/keepalived.conf on the Pi Zero (bare metal).
! Unicast instead of multicast, because VRRP multicast doesn't get through over WLAN.
! NOTE: auth_pass is a placeholder here — set the real value at deploy time
!       (kept in Proton Pass; must be identical on BOTH nodes).

global_defs {
    router_id pi-zero
    enable_script_security
    script_user root
}

vrrp_script chk_dnsdist {
    script "/etc/keepalived/chk_dnsdist.sh"
    interval 2
    weight -20
    fall 2
    rise 2
}

vrrp_instance DNS_VIP {
    state BACKUP
    interface wlan0
    virtual_router_id 50
    priority 100
    advert_int 5
    unicast_src_ip <PIZERO_IP>
    unicast_peer {
        <DNS_HA_VM_IP>
    }
    authentication {
        auth_type PASS
        auth_pass __SET_AT_DEPLOY__
    }
    virtual_ipaddress {
        <VIP>/32 dev wlan0
    }
    track_script {
        chk_dnsdist
    }
    notify_master "/etc/keepalived/notify_telegram.sh MASTER"
    notify_backup "/etc/keepalived/notify_telegram.sh BACKUP"
    notify_fault  "/etc/keepalived/notify_telegram.sh FAULT"
}
