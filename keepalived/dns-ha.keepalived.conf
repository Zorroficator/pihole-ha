! keepalived — dns-ha (VRRP MASTER, UNICAST)
! Deploy target: /etc/keepalived/keepalived.conf on the dns-ha VM (on the server).
! Unicast instead of multicast, because VRRP multicast doesn't get through over the Pi Zero's WLAN.
! NOTE: auth_pass is a placeholder here — set the real value at deploy time
!       (kept in Proton Pass; must be identical on BOTH nodes).

global_defs {
    router_id dns-ha
    enable_script_security
    script_user root
}

vrrp_script chk_dnsdist {
    script "/etc/keepalived/chk_dnsdist.sh"
    interval 2
    weight -60
    fall 2
    rise 2
}

vrrp_instance DNS_VIP {
    state MASTER
    interface enp0s2
    virtual_router_id 50
    priority 150
    advert_int 5
    unicast_src_ip <DNS_HA_VM_IP>
    unicast_peer {
        <PIZERO_IP>
    }
    authentication {
        auth_type PASS
        auth_pass __SET_AT_DEPLOY__
    }
    virtual_ipaddress {
        <VIP>/32 dev enp0s2
    }
    track_script {
        chk_dnsdist
    }
    notify_master "/etc/keepalived/notify_telegram.sh MASTER"
    notify_backup "/etc/keepalived/notify_telegram.sh BACKUP"
    notify_fault  "/etc/keepalived/notify_telegram.sh FAULT"
}
