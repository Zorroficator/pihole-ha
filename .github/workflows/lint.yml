name: Lint shell scripts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every *.sh
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            echo "── $f"
            bash -n "$f" || fail=1
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $fail
